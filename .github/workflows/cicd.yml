name: Reusable CI/CD

on:
  workflow_call:
    inputs:
      tasks:
        description: 'Space-separated mise tasks to run, in order, before release (e.g. "init test")'
        type: string
        default: "test"
      cache-path:
        description: "Optional actions/cache path (skipped entirely if empty)"
        type: string
        default: ""
      cache-hash:
        description: "Glob of files whose hash keys the cache (e.g. .terraform.lock.hcl), required if cache-path is set"
        type: string
        default: ""

jobs:
  cicd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.18

      # hashFiles() only works inside steps, so callers pass a glob instead of a ready key.
      - if: inputs.cache-path != ''
        uses: actions/cache@v6
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ runner.os }}-${{ hashFiles(inputs.cache-hash) }}

      - name: Run tasks
        run: |
          for task in ${{ inputs.tasks }}; do
            mise run "$task"
          done

      - if: github.event_name == 'push'
        name: Release
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ github.token }}
